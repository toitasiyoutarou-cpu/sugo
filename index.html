<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHEM QUEST Ver.5｜実験まとめ 二連戦</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="logo">🧪 CHEM QUEST</div>
      <div class="sub">実験まとめ 二連戦：熱分解スライム → CaCO₃ゴーレム</div>
    </div>
    <div class="status">
      <div class="pill" id="stagePill">⚔ 連戦 1/2</div>
      <div class="pill" id="qPill">問題 1/5</div>
      <div class="pill hp" id="playerHpTop">HP 100/100</div>
      <div class="pill" id="missPill">❤ ミス 0/3</div>
    </div>
  </header>

  <main class="battle-layout">
    <section class="left-zone">
      <div class="boss-card panel">
        <div class="chapter-banner" id="chapterTitle">第1戦：熱分解スライム</div>
        <div class="speech" id="bossSpeech">熱分解スライムが あらわれた！</div>
        <div class="boss-art" id="bossArt"><img id="bossImg" src="" alt="boss" /></div>
        <div class="boss-row">
          <div>
            <div class="boss-name" id="bossName"></div>
            <div class="boss-sub" id="bossSub"></div>
          </div>
          <div class="hp-number" id="bossHpText">200/200</div>
        </div>
        <div class="bar"><div class="fill boss-fill" id="bossHpBar"></div></div>
      </div>

      <div class="player-card panel">
        <div class="player-avatar">🧑‍🔬⚔️</div>
        <div class="player-info">
          <div class="player-title">あなた</div>
          <div class="bar"><div class="fill player-fill" id="playerHpBar"></div></div>
          <div class="hp-number" id="playerHpText">100/100</div>
        </div>
      </div>

      <div class="data-card panel">
        <div class="data-title">📜 式量・使えるデータ</div>
        <div class="data" id="dataBox"></div>
      </div>
    </section>

    <section class="right-zone panel">
      <div class="question-head">
        <span class="questionNo" id="questionNo">問題 1</span>
        <span class="tag" id="questionTag">物質量</span>
      </div>
      <div class="mini-board" id="focusBox"></div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choices"></div>
      <div class="actions">
        <button class="action attack" id="attackBtn">⚔ こうげき！（解答）</button>
        <button class="action next" id="nextBtn">つぎへ →</button>
        <button class="action reset" id="resetBtn">リセット</button>
      </div>
      <div class="scientist-wrap"><img src="img/scientist.png" alt="若手科学者" class="scientist" /></div>
      <div class="result" id="resultBox">選択肢を選んで「こうげき！」を押そう。</div>
    </section>
  </main>
  <div class="footer-note">正解でボスにダメージ。最終問題は「かいしんのいちげき！」</div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">LEVEL UP!</h2>
    <p id="modalText"></p>
    <button class="action next" onclick="closeModal()">つづける</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
