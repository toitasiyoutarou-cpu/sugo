<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CHEM QUEST Ver.6</title><link rel="stylesheet" href="style.css">
<style>
.reaction-box{
  margin:10px 0 12px;
  padding:12px 14px;
  border:3px solid #f4c44f;
  border-radius:16px;
  background:linear-gradient(180deg,#fff8da,#fff1b8);
  color:#1d2433;
  box-shadow:0 5px 0 rgba(96,62,12,.22);
  font-weight:900;
}
.reaction-box .reaction-label{
  display:inline-block;
  margin-bottom:6px;
  padding:3px 10px;
  border-radius:999px;
  background:#16324a;
  color:#fff2a8;
  font-size:14px;
}
.reaction-box .reaction-formula{
  font-size:clamp(20px,4vw,31px);
  line-height:1.35;
  letter-spacing:.02em;
  text-align:center;
}
</style>
</head>
<body>
<div class="title-screen" id="titleScreen"><div class="title-card">
<div class="title-logo">🧪 CHEM QUEST</div><div class="title-sub">実験まとめ 二連戦</div>
<div class="title-route">熱分解スライム → CaCO₃ゴーレム</div>
<div class="name-box"><label for="playerNameInput">若手科学者の名前</label><input id="playerNameInput" type="text" placeholder="省略すると「科学者」"></div><button class="title-btn" id="startBtn">▶ START</button>
<div class="howto">正解でボスにダメージ。最終問題は「かいしんのいちげき！」<br>3ミスで敗北。同じ問題に再挑戦できます。</div>
</div></div>
<div class="wrap" id="gameWrap">
<header class="topbar"><div class="brand"><div class="logo">🧪 CHEM QUEST</div><div class="sub">実験まとめ 二連戦：熱分解スライム → CaCO₃ゴーレム</div></div>
<div class="status"><div class="pill" id="stagePill">⚔ 連戦 1/2</div><div class="pill" id="qPill">問題 1/5</div><div class="pill hp" id="playerHpTop">HP 100/100</div><div class="pill" id="missPill">❤ ミス 0/3</div></div></header>
<main class="battle-layout"><section class="left-zone">
<div class="boss-card panel"><div class="chapter-banner" id="chapterTitle"></div><div class="speech" id="bossSpeech"></div><div class="boss-art" id="bossArt"><img id="bossImg" src="" alt="boss"></div>
<div class="boss-row"><div><div class="boss-name" id="bossName"></div><div class="boss-sub" id="bossSub"></div></div><div class="hp-number" id="bossHpText"></div></div><div class="bar"><div class="fill boss-fill" id="bossHpBar"></div></div></div>
<div class="player-card panel"><img src="img/young_scientist.png" class="player-scientist" alt="若手科学者"><div class="player-info"><div class="player-title" id="playerNameLabel">科学者</div><div class="bar"><div class="fill player-fill" id="playerHpBar"></div></div><div class="hp-number" id="playerHpText">100/100</div></div></div>
<div class="data-card panel"><div class="data-title">📜 式量・使えるデータ</div><div class="data" id="dataBox"></div></div>
</section><section class="right-zone panel">
<div class="question-head"><span class="questionNo" id="questionNo"></span><span class="tag" id="questionTag"></span></div>
<div class="mini-board" id="focusBox"></div><div class="reaction-box" id="reactionBox" hidden></div><div class="question" id="questionText"></div><div class="choices" id="choices"></div>
<div class="actions"><button class="action attack" id="attackBtn">⚔ こうげき！（解答）</button><button class="action hint" id="hintBtn">👴 ヒント</button><button class="action next" id="nextBtn">つぎへ →</button><button class="action reset" id="resetBtn">リセット</button></div>
<div class="result" id="resultBox"></div>
</section></main><div class="footer-note">若手科学者が攻撃。老科学者はヒント担当。</div></div>

<div class="attack-pop" id="attackPop">
  <img src="img/young_scientist.png" alt="攻撃する科学者">
  <div class="attack-word" id="attackWord">いけっ！</div>
</div>
<div class="damage-pop" id="damagePop">40 DAMAGE!</div>

<div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><button class="action next" id="modalButton" onclick="closeModal()">つづける</button></div></div>
<div class="hint-overlay" id="hintOverlay"><div class="hint-card"><img src="img/old_scientist.png" class="old-scientist" alt="老科学者"><div class="hint-text"><div class="hint-name">老科学者</div><div id="hintText"></div><button class="action next" onclick="closeHint()">わかった！</button></div></div></div>
<script src="script.js"></script>
<script>
(() => {
  const AUDIO_PATH = 'audio/';
  const sounds = {
    battle: new Audio(AUDIO_PATH + 'battle.mp3'),
    correct: new Audio(AUDIO_PATH + 'correct.mp3'),
    wrong: new Audio(AUDIO_PATH + 'wrong.mp3'),
    levelup: new Audio(AUDIO_PATH + 'levelup.mp3')
  };
  sounds.battle.loop = true;
  sounds.battle.volume = 0.28;
  sounds.correct.volume = 0.7;
  sounds.wrong.volume = 0.7;
  sounds.levelup.volume = 0.8;

  let bgmStarted = false;
  let lastResult = '';

  function play(a, restart = true) {
    try {
      if (restart) a.currentTime = 0;
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
    } catch(e) {}
  }
  function startBgm(){ bgmStarted = true; play(sounds.battle, false); }
  function stopBgm(){ try { sounds.battle.pause(); sounds.battle.currentTime = 0; } catch(e){} }

  window.addEventListener('DOMContentLoaded', () => {
    const startBtn = document.getElementById('startBtn');
    const attackBtn = document.getElementById('attackBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultBox = document.getElementById('resultBox');
    const modalTitle = document.getElementById('modalTitle');

    startBtn?.addEventListener('click', () => setTimeout(startBgm, 120));
    resetBtn?.addEventListener('click', () => { stopBgm(); bgmStarted = false; });

    attackBtn?.addEventListener('click', () => {
      setTimeout(() => {
        const txt = (resultBox?.textContent || '').trim();
        if (!txt || txt === lastResult) return;
        lastResult = txt;
        if (/正解|成功|かいしん|撃破|クリア|勝利|DAMAGE|ダメージ/.test(txt)) play(sounds.correct);
        else if (/不正解|ちが|違|ミス|失敗|残念/.test(txt)) play(sounds.wrong);
      }, 180);
    });

    if (modalTitle) {
      new MutationObserver(() => {
        const t = modalTitle.textContent || '';
        if (/撃破|クリア|勝利|CLEAR|LEVEL|レベル/.test(t)) play(sounds.levelup);
        if (/敗北|GAME OVER/.test(t)) play(sounds.wrong);
      }).observe(modalTitle, {childList:true, characterData:true, subtree:true});
    }

    document.addEventListener('pointerdown', () => {
      Object.values(sounds).forEach(a => { try { a.load(); } catch(e) {} });
    }, { once:true });
  });
})();
</script>

<script>
(() => {
  const reactions = [
    {
      test: t => /NaHCO|炭酸水素ナトリウム|熱分解/.test(t) && /(Na₂CO₃|Na2CO3|炭酸ナトリウム|CO₂|CO2|mol|モル|質量|式)/.test(t),
      formula: '2NaHCO₃ → Na₂CO₃ + H₂O + CO₂'
    },
    {
      test: t => /(CaCO₃|CaCO3|炭酸カルシウム)/.test(t) && /(HCl|塩酸|CO₂|CO2|二酸化炭素|mol|モル|質量|式)/.test(t),
      formula: 'CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂'
    },
    {
      test: t => /(H₂O₂|H2O2|過酸化水素)/.test(t) && /(O₂|O2|酸素|式|係数|mol|モル)/.test(t),
      formula: '2H₂O₂ → 2H₂O + O₂'
    }
  ];

  function updateReactionBox(){
    const q = document.getElementById('questionText');
    const box = document.getElementById('reactionBox');
    if(!q || !box) return;
    const text = q.textContent || '';
    const hit = reactions.find(r => r.test(text));
    if(hit){
      box.hidden = false;
      box.innerHTML = '<div class="reaction-label">この問いで使う反応式</div><div class="reaction-formula">' + hit.formula + '</div>';
    }else{
      box.hidden = true;
      box.innerHTML = '';
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    updateReactionBox();
    const q = document.getElementById('questionText');
    if(q){
      new MutationObserver(updateReactionBox).observe(q, {childList:true, subtree:true, characterData:true});
    }
    ['nextBtn','attackBtn','hintBtn','resetBtn','startBtn'].forEach(id => {
      document.getElementById(id)?.addEventListener('click', () => setTimeout(updateReactionBox, 80));
    });
  });
})();
</script>
</body></html>
