<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CHEM QUEST Ver.6</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="title-screen" id="titleScreen"><div class="title-card">
<div class="title-logo">🧪 CHEM QUEST</div><div class="title-sub">実験まとめ 二連戦</div>
<div class="title-route">熱分解スライム → CaCO₃ゴーレム</div>
<button class="title-btn" id="startBtn">▶ START</button>
<div class="howto">正解でボスにダメージ。最終問題は「かいしんのいちげき！」<br>3ミスで敗北。同じ問題に再挑戦できます。</div>
</div></div>
<div class="wrap" id="gameWrap">
<header class="topbar"><div class="brand"><div class="logo">🧪 CHEM QUEST</div><div class="sub">実験まとめ 二連戦：熱分解スライム → CaCO₃ゴーレム</div></div>
<div class="status"><div class="pill" id="stagePill">⚔ 連戦 1/2</div><div class="pill" id="qPill">問題 1/5</div><div class="pill hp" id="playerHpTop">HP 100/100</div><div class="pill" id="missPill">❤ ミス 0/3</div></div></header>
<main class="battle-layout"><section class="left-zone">
<div class="boss-card panel"><div class="chapter-banner" id="chapterTitle"></div><div class="speech" id="bossSpeech"></div><div class="boss-art" id="bossArt"><img id="bossImg" src="" alt="boss"></div>
<div class="boss-row"><div><div class="boss-name" id="bossName"></div><div class="boss-sub" id="bossSub"></div></div><div class="hp-number" id="bossHpText"></div></div><div class="bar"><div class="fill boss-fill" id="bossHpBar"></div></div></div>
<div class="player-card panel"><img src="img/young_scientist.png" class="player-scientist" alt="若手科学者"><div class="player-info"><div class="player-title">若手科学者</div><div class="bar"><div class="fill player-fill" id="playerHpBar"></div></div><div class="hp-number" id="playerHpText">100/100</div></div></div>
<div class="data-card panel"><div class="data-title">📜 式量・使えるデータ</div><div class="data" id="dataBox"></div></div>
</section><section class="right-zone panel">
<div class="question-head"><span class="questionNo" id="questionNo"></span><span class="tag" id="questionTag"></span></div>
<div class="mini-board" id="focusBox"></div><div class="question" id="questionText"></div><div class="choices" id="choices"></div>
<div class="actions"><button class="action attack" id="attackBtn">⚔ こうげき！（解答）</button><button class="action hint" id="hintBtn">👴 ヒント</button><button class="action next" id="nextBtn">つぎへ →</button><button class="action reset" id="resetBtn">リセット</button></div>
<div class="attack-scientist-wrap"><img src="img/young_scientist.png" id="attackScientist" class="attack-scientist" alt="攻撃する若手科学者"></div><div class="result" id="resultBox"></div>
</section></main><div class="footer-note">若手科学者が攻撃。老科学者はヒント担当。</div></div>
<div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><button class="action next" id="modalButton" onclick="closeModal()">つづける</button></div></div>
<div class="hint-overlay" id="hintOverlay"><div class="hint-card"><img src="img/old_scientist.png" class="old-scientist" alt="老科学者"><div class="hint-text"><div class="hint-name">老科学者</div><div id="hintText"></div><button class="action next" onclick="closeHint()">わかった！</button></div></div></div>
<script src="script.js"></script></body></html>
